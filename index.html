<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Clone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <style>

  * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background-color: #0f0f0f;
  color: #ffffff;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  height: 56px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 16px;
  background-color: #0f0f0f;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.menu-icon {
  font-size: 18px;
  cursor: pointer;
}

.logo {
  font-size: 18px;
  font-weight: bold;
  color: white;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 4px;
}

.logo-icon {
  color: #ff0000;
  font-size: 22px;
}

.header-center {
  display: flex;
  align-items: center;
  flex: 0 1 600px;
}

.search-box {
  display: flex;
  width: 100%;
}

.search-input {
  width: 100%;
  height: 40px;
  background-color: #121212;
  border: 1px solid #303030;
  border-radius: 40px 0 0 40px;
  padding: 0 16px;
  color: #fff;
  outline: none;
}

.search-btn {
  width: 64px;
  height: 40px;
  background-color: #222222;
  border: 1px solid #303030;
  border-left: none;
  border-radius: 0 40px 40px 0;
  color: #fff;
  cursor: pointer;
}

.mic-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background-color: #222222;
  border: none;
  color: #fff;
  margin-left: 12px;
  cursor: pointer;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.icon-btn {
  font-size: 20px;
  cursor: pointer;
}

.main-container {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.sidebar {
  width: 240px;
  min-width: 240px;
  background-color: #0f0f0f;
  overflow-y: auto;
  padding: 12px;
}

.nav-section {
  border-bottom: 1px solid #272727;
  padding-bottom: 12px;
  margin-bottom: 12px;
}

.section-title {
  font-size: 14px;
  font-weight: bold;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 14px;
  cursor: pointer;
}

.nav-item:hover {
  background-color: #272727;
}

.nav-item.active {
  background-color: #272727;
  font-weight: bold;
}

.nav-item i {
  font-size: 18px;
  width: 24px;
  text-align: center;
}

.avatar {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background-color: #555;
}

.content-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}
 </style>
</head>
<body>

  <header class="header">
    <div class="header-left">
      <i class="fa-solid fa-bars menu-icon"></i>
      <a href="#" class="logo">
        <i class="fa-brands fa-youtube logo-icon"></i> YouTube
      </a>
    </div>

    <div class="header-center">
      <div class="search-box">
        <input type="text" class="search-input" placeholder="Search">
        <button class="search-btn">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
      <button class="mic-btn">
        <i class="fa-solid fa-microphone"></i>
      </button>
    </div>

    <div class="header-right">
      <i class="fa-regular fa-bell icon-btn"></i>
    </div>
  </header>

  <div class="main-container">
    <aside class="sidebar">
      <div class="nav-section">
        <div class="nav-item active">
          <i class="fa-solid fa-house"></i> <span>Home</span>
        </div>
        <div class="nav-item">
          <i class="fa-solid fa-bolt"></i> <span>Shorts</span>
        </div>
      </div>

      <div class="nav-section">
        <div class="section-title">Subscriptions <i class="fa-solid fa-chevron-right"></i></div>
        <div class="nav-item"><div class="avatar"></div> <span>dish and flavors</span></div>
        <div class="nav-item"><div class="avatar"></div> <span>the educational...</span></div>
        <div class="nav-item"><div class="avatar"></div> <span>HAR PAL GEO</span></div>
      </div>

      <div class="nav-section">
        <div class="section-title">You <i class="fa-solid fa-chevron-right"></i></div>
        <div class="nav-item"><i class="fa-solid fa-user"></i> <span>Your channel</span></div>
        <div class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i> <span>History</span></div>
        <div class="nav-item"><i class="fa-solid fa-list"></i> <span>Playlists</span></div>
        <div class="nav-item"><i class="fa-regular fa-clock"></i> <span>Watch later</span></div>
        <div class="nav-item"><i class="fa-regular fa-thumbs-up"></i> <span>Liked videos</span></div>
        <div class="nav-item"><i class="fa-solid fa-video"></i> <span>Your videos</span></div>
        <div class="nav-item"><i class="fa-solid fa-download"></i> <span>Downloads</span></div>
      </div>
    </aside>
      <main class="content-area">
  <img src="image/Screenshot 2026-09-30 1.22.46 PM.png" alt="YouTube Content" class="full-screenshot">
</main>
  </div>

</body>
</html>
